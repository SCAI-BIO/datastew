name: Zenodo Metadata

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zenodo-metadata
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Sync Zenodo metadata
        uses: tiadams/zenodo-schema-sync@v1.0.0
        with:
          mode: sync
          token: ${{ secrets.ZENODO_TOKEN }}
