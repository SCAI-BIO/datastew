[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "datastew"
module-root = ""

[project]
name = "datastew"
version = "0.1.0"
description = "Datastew is a python library for intelligent data harmonization using Large Language Model (LLM) vector embeddings."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.16"
authors = [
    { name = "Tim Adams", email = "tim.adams@scai.fraunhofer.de" },
    { name = "Mehmet Can Ay", email = "mehmet.ay@scai.fraunhofer.de" },
]
keywords = ["data-harmonization", "LLM", "embeddings", "data-steward"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

dependencies = [
    "cachetools>=7.2.4",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "ollama>=0.6.3",
    "openai>=3.35.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pgvector>=0.5.1",
    "plotly>=7.1.0",
    "psycopg[binary]>=3.3.6",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "sentence-transformers>=6.1.0",
    "sqlalchemy>=2.1.5",
    "torch>=2.14.1",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "pytest-cov>=7.1.0", "ruff>=0.17.1"]


[project.urls]
Homepage = "https://github.com/SCAI-BIO/datastew"
Repository = "https://github.com/SCAI-BIO/datastew"
Documentation = "https://github.com/SCAI-BIO/datastew#readme"
Tracker = "https://github.com/SCAI-BIO/datastew/issues"

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "python_version >= '3.15'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "UP",
    "I",
    "C90",
    "B",
    "SIM",
    "PERF",
    "PLC",
    "PLE",
    "PLW",
    "RUF",
]

[tool.ruff.lint.mccabe]
max-complexity = 10
